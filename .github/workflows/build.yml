name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: open-watcom/setup-watcom@v0
        with:
          version: "2.0"

      - name: Build NDISFIX.EXE
        run: make INCLUDE="$WATCOM/h"

      - uses: actions/upload-artifact@v4
        with:
          name: NDISFIX
          path: NDISFIX.EXE

      # On a version tag (for example v1.2), attach the EXE to a release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NDISFIX.EXE
